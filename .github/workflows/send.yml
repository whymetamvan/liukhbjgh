name: Reload > Send Requests

on:
  schedule:
    # 06:00 WIB = 23:00 UTC hari sebelumnya (cron GitHub pakai UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write          # wajib: biar bot bisa push balik log.txt

concurrency:
  group: reload-send
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Reload JWT (1x) + Send Requests
        run: python main.py

      - name: Commit & push log.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.txt
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada log.txt"
          else
            git commit -m "chore: update log.txt [skip ci]"
            git push
          fi
